name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # ISSUE FIX: The Gradle Wrapper validation was failing because the gradle-wrapper.jar
    # had an unknown hash. This step uses gradle/wrapper-validation-action to ensure the
    # wrapper is valid before proceeding. If it fails, the wrapper JAR needs to be regenerated.
    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Decode Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        touch .env

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Run Unit & Robolectric Tests
      run: ./gradlew :app:testDebugUnitTest --no-daemon

    - name: Verify R8 Minification & Shrink Rules
      run: ./gradlew :app:minifyReleaseWithR8 --no-daemon

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Unit-Test-Reports
        path: app/build/reports/tests/testDebugUnitTest/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cuktech-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14
